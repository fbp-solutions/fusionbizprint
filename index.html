<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusion Business & Print Solutions | Your Gateway to Business Excellence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --executive-navy: #0F2B48;
      --brushed-gold: #C5A059;
      --brushed-gold-hover: #b08d48;
      --warm-studio-paper: #F8F6F0;
      --navy-light: #163c63;
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --white: #FFFFFF;
      --shadow-sm: 0 1px 3px rgba(15, 43, 72, 0.08);
      --shadow-md: 0 4px 12px rgba(15, 43, 72, 0.1);
      --shadow-lg: 0 10px 25px rgba(15, 43, 72, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      color: var(--text-dark);
      background-color: var(--warm-studio-paper);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    /* Navigation Header */
    header {
      background-color: var(--executive-navy);
      color: var(--white);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-md);
      border-bottom: 3px solid var(--brushed-gold);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--white);
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      background: var(--executive-navy);
      border: 2px solid var(--brushed-gold);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--brushed-gold);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .logo-subtitle {
      font-size: 0.65rem;
      color: var(--brushed-gold);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 2rem;
      align-items: center;
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--brushed-gold);
    }

    .nav-highlight {
      color: var(--brushed-gold) !important;
      font-weight: 700 !important;
    }

    .btn-primary {
      background-color: var(--brushed-gold);
      color: var(--executive-navy);
      padding: 0.65rem 1.35rem;
      border-radius: 4px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.1s;
      border: none;
      cursor: pointer;
      display: inline-block;
    }

    .btn-primary:hover {
      background-color: var(--brushed-gold-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--executive-navy);
      padding: 0.65rem 1.35rem;
      border-radius: 4px;
      font-weight: 700;
      text-decoration: none;
      border: 2px solid var(--executive-navy);
      transition: all 0.2s;
      cursor: pointer;
      display: inline-block;
    }

    .btn-secondary:hover {
      background-color: var(--executive-navy);
      color: var(--white);
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, var(--executive-navy) 0%, var(--navy-light) 100%);
      color: var(--white);
      padding: 5rem 2rem 5.5rem;
      text-align: center;
      position: relative;
    }

    .hero-content {
      max-width: 850px;
      margin: 0 auto;
    }

    .badge-gold {
      background-color: rgba(197, 160, 89, 0.15);
      color: var(--brushed-gold);
      border: 1px solid var(--brushed-gold);
      padding: 0.35rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 1.25rem;
    }

    .hero h1 {
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }

    .hero p {
      font-size: 1.15rem;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 2rem;
      max-width: 720px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-cta {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Section Header */
    .section-header {
      text-align: center;
      max-width: 700px;
      margin: 4rem auto 2.5rem;
      padding: 0 1rem;
    }

    .section-header h2 {
      font-size: 2rem;
      color: var(--executive-navy);
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .section-header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Core Services Grid */
    .services-container {
      max-width: 1200px;
      margin: 0 auto 3rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    .service-card {
      background: var(--white);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      padding: 2.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .service-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }

    .service-icon {
      width: 50px;
      height: 50px;
      background: rgba(197, 160, 89, 0.12);
      color: var(--brushed-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 1.35rem;
      margin-bottom: 1.25rem;
    }

    .service-card h3 {
      font-size: 1.35rem;
      color: var(--executive-navy);
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .service-card p {
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    /* Specialized Realtor Hub Callout Banner */
    .hub-banner-wrapper {
      max-width: 1200px;
      margin: 0 auto 4rem;
      padding: 0 1.5rem;
    }

    .hub-banner {
      background: var(--executive-navy);
      border: 2px solid var(--brushed-gold);
      border-radius: 8px;
      padding: 2.5rem;
      color: var(--white);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 2rem;
      box-shadow: var(--shadow-md);
    }

    .hub-banner h3 {
      color: var(--white);
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .hub-banner p {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.98rem;
      max-width: 650px;
      margin: 0;
    }

    /* Partner Ecosystem / Tools Grid */
    .ecosystem-container {
      max-width: 1200px;
      margin: 0 auto 5rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    .tool-card {
      background: var(--white);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .tool-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .tool-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1rem;
    }

    .tool-header i {
      font-size: 1.35rem;
      color: var(--brushed-gold);
    }

    .tool-header h4 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--executive-navy);
    }

    .tool-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .tool-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--executive-navy);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .tool-link:hover {
      color: var(--brushed-gold);
    }

    /* Footer */
    footer {
      background-color: var(--executive-navy);
      color: var(--white);
      padding: 3rem 2rem 2rem;
      border-top: 4px solid var(--brushed-gold);
    }

    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .footer-col h4 {
      color: var(--brushed-gold);
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .footer-col p, .footer-col a {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      font-size: 0.9rem;
      line-height: 1.8;
    }

    .footer-col a:hover {
      color: var(--brushed-gold);
    }

    .footer-bottom {
      max-width: 1200px;
      margin: 0 auto;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      font-size: 0.8rem;
