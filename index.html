<head>

    <style>
        :root {
            --navy: #0F2B48;
            --gold: #C5A059;
            --gold-hover: #b08d48;
            --paper: #F8F6F0;
            --dark: #1E293B;
            --gray-text: #475569;
            --border: #E2E8F0;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif, -apple-system, BlinkMacSystemFont;
            color: var(--dark);
            background-color: var(--paper);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Header / Nav */
        header {
            background-color: var(--navy);
            color: var(--white);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--gold);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--white);
        }

        .logo-box {
            width: 42px;
            height: 42px;
            background: var(--navy);
            border: 2px solid var(--gold);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--gold);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .logo-subtitle {
            font-size: 0.6rem;
            color: var(--gold);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--gold);
        }

        .btn-gold {
            background-color: var(--gold);
            color: var(--navy);
            padding: 0.65rem 1.35rem;
            border-radius: 4px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s;
        }

        .btn-gold:hover {
            background-color: var(--gold-hover);
        }

        /* Hero Section */
        .hero {
            padding: 90px 0 70px;
            text-align: center;
            background: linear-gradient(180deg, var(--navy) 0%, #16365c 100%);
            color: var(--white);
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            max-width: 850px;
            margin: 0 auto 20px;
            line-height: 1.2;
        }

        .hero h1 span {
            color: var(--gold);
        }

        .hero p {
            font-size: 1.2rem;
            color: #cbd5e1;
            max-width: 700px;
            margin: 0 auto 35px;
        }

        /* Sections */
        section {
            padding: 70px 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-header h2 {
            font-size: 2.25rem;
            color: var(--navy);
            font-weight: 800;
            margin-bottom: 10px;
        }

        .section-header p {
            color: var(--gray-text);
            font-size: 1.05rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(15, 43, 72, 0.08);
            border-color: var(--gold);
        }

        .card h3 {
            font-size: 1.5rem;
            color: var(--navy);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .card p {
            color: var(--gray-text);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .card-link {
            font-weight: 700;
            color: var(--navy);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-link:hover {
            color: var(--gold);
        }

        /* Lifecycle Section */
        .lifecycle-section {
            background-color: var(--white);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .lifecycle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .lifecycle-step {
            background: var(--paper);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid var(--border);
            position: relative;
        }

        .step-num {
            font-size: 2rem;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 10px;
            line-height: 1;
        }

        .lifecycle-step h4 {
            color: var(--navy);
            font-size: 1.15rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .lifecycle-step p {
            color: var(--gray-text);
            font-size: 0.9rem;
        }

        /* Booking / Intake CTA Banner */
        .intake-banner {
            background: linear-gradient(135deg, var(--navy) 0%, #1a3a5f 100%);
            color: var(--white);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            margin: 40px 0;
            border: 2px solid var(--gold);
        }

        .intake-banner h3 {
            font-size: 2rem;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .intake-banner p {
            color: #cbd5e1;
            max-width: 650px;
            margin: 0 auto 30px;
            font-size: 1.05rem;
        }

        /* Footer */
        footer {
            background-color: var(--navy);
            color: var(--white);
            padding: 50px 0 20px;
            border-top: 4px solid var(--gold);
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .footer-col p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 15px;
            max-width: 350px;
        }

        .footer-col h4 {
            color: var(--gold);
            font-size: 1rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .footer-col ul {
            list-style: none;
        }

        .footer-col ul li {
            margin-bottom: 8px;
        }

        .footer-col ul li a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .footer-col ul li a:hover {
            color: var(--gold);
        }

        .footer-bottom {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 0.85rem;
        }
